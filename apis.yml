aid: thrive-causemetics
name: Thrive Causemetics
description: 'Thrive Causemetics is a direct-to-consumer, cause-driven beauty brand selling
  cosmetics (makeup) under the Thrive Causemetics label and skincare under its Bigger Than
  Beauty Skincare line. The company operates a Shopify-based e-commerce storefront with a
  loyalty/rewards program, subscriptions, and referral offers, and donates products and
  funds to charitable partners with every purchase. It was surfaced as a portfolio company
  of Trinity Ventures and added to the API Evangelist network. As of this enrichment pass
  Thrive Causemetics publishes no public developer program, API documentation, or machine
  discovery surface; this profile captures its public web identity and domain-security posture.'
